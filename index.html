<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitob Korrektori - AI Yordamchi</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="app-container">
        <!-- Sarlavha -->
        <header class="app-header">
            <div class="logo">
                <i class="fa-solid fa-book-open-reader"></i>
                <h1>Kitob Korrektori AI</h1>
            </div>
            <p>Matnlardagi imlo, tinish belgisi va uslubiy xatolarni avtomatik aniqlang</p>
        </header>

        <!-- Asosiy ishchi qism -->
        <main class="workspace">
            <!-- Chap tomon: Matn kiritish joyi -->
            <section class="editor-section">
                <div class="section-title">
                    <i class="fa-solid fa-pen-to-square"></i> Kitob matni (Asl nusxa)
                </div>
                <textarea id="sourceText" placeholder="Kitob matnini shu yerga kiriting yoki tashlang..."></textarea>
                <button id="checkBtn" class="primary-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> Matnni tekshirish
                </button>
            </section>

            <!-- O'ng tomon: AI tahlili va xatolar ro'yxati -->
            <section class="analysis-section">
                <div class="section-title">
                    <i class="fa-solid fa-clipboard-check"></i> AI Tahlili va Xatolar Ro'yxati
                </div>
                <div class="analysis-results" id="analysisResults">
                    <div class="placeholder-text">
                        <i class="fa-solid fa-info-circle"></i>
                        <p>Matn kiritib, "Matnni tekshirish" tugmasini bosing. AI kiritgan matningizni tahlil qiladi.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript - Xavfsiz ishga tushirish uchun -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const checkBtn = document.getElementById('checkBtn');
            const sourceText = document.getElementById('sourceText');
            const analysisResults = document.getElementById('analysisResults');

            checkBtn.addEventListener('click', () => {
                const text = sourceText.value.trim();
                
                if (text === '') {
                    alert('Iltimos, tekshirish uchun matn kiriting!');
                    return;
                }

                // Yuklanmoqda holati
                analysisResults.innerHTML = `
                    <div class="loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        <p>AI matningizni o'qib chiqmoqda...</p>
                    </div>
                `;

                // Simulyatsiya va natija chiqarish
                setTimeout(() => {
                    const words = text.split(/\s+/);
                    const detectedErrors = [];

                    if (text.length < 20) {
                        detectedErrors.push({
                            type: "Uslubiy ogohlantirish",
                            desc: `Kiritilgan matn juda qisqa. To'liqroq jumla kiriting.`,
                            suggestion: "Matn hajmini oshiring",
                            warning: true
                        });
                    } else {
                        detectedErrors.push({
                            type: "Imlo xatosi",
                            desc: `"${words[0]}" so'zining bosh harfi yoki imlosini tekshiring.`,
                            suggestion: words[0],
                            warning: false
                        });

                        detectedErrors.push({
                            type: "Tinish belgisi",
                            desc: `Qo'shma gaplar orasidagi tinish belgilarini ko'rib chiqing.`,
                            suggestion: "Vergul yoki nuqtani tekshiring",
                            warning: true
                        });

                        detectedErrors.push({
                            type: "Uslubiy tavsiya",
                            desc: `Jumla tuzilishi biroz murakkab.`,
                            suggestion: "Sodda jumlalarga bo'lish tavsiya etiladi",
                            warning: false
                        });
                    }

                    let htmlContent = `<div class="success-note"><i class="fa-solid fa-check-circle"></i> Tahlil yakunlandi. Jami ${detectedErrors.length} ta tavsiya topildi:</div>`;

                    detectedErrors.forEach((err, index) => {
                        htmlContent += `
                            <div class="error-card">
                                <div class="error-type ${err.warning ? 'warning' : ''}">Tavsiya #${index + 1}: ${err.type}</div>
                                <p class="error-desc">${err.desc}</p>
                                <div class="correction-box">Tavsiya: <span class="correct-word">${err.suggestion}</span></div>
                            </div>
                        `;
                    });

                    analysisResults.innerHTML = htmlContent;
                }, 1200);
            });
        });
    </script>
</body>
</html>
